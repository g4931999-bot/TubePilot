name: tubepilot_flutter
description: "TubePilot - YouTube Auto Uploader & Scheduler"
publish_to: 'none'
version: 1.0.2+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.1
  http_parser: ^4.0.2

  # Local persistence (theme preference, tokens)
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Auth
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.0
  app_links: ^7.2.1

  gal: ^2.3.0
  path_provider: ^2.1.0

  # Chrome Custom Tabs / SFSafariViewController
  flutter_custom_tabs: ^2.2.0

  # Push notifications
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  onesignal_flutter: ^5.2.4

  # Payment Gateway
  flutter_cashfree_pg_sdk: ^2.2.9+47

  # Media permissions
  permission_handler: ^11.3.1

  # File pickers & Preview
  image_picker: ^1.1.2
  video_player: ^2.9.1

  # ⚠️ NEW — Live Stream update
  # Phone camera se seedha YouTube par RTMP live (live_camera_screen.dart)
  apivideo_live_stream: ^1.2.0
  # Live chalte waqt app ke andar YouTube ka live preview (live_stream_screen.dart)
  youtube_player_iframe: ^5.2.2
  # Camera live ke dauraan screen on rakhne ke liye
  wakelock_plus: ^1.2.8

  # Utilities
  intl: ^0.20.3
  fl_chart: ^1.2.0
  cached_network_image: ^3.3.1
  mime: ^2.0.0
  share_plus: ^12.0.2
  package_info_plus: ^8.0.0
  payu_checkoutpro_flutter: ^1.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Icon generator only
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding_ai.png
    - assets/diwali_bg.png
    - assets/companylogo.png
    - assets/signature.png
    - assets/icon.png
    - assets/splash.png
    # ⚠️ NEW (Boss request): real onboarding step icons — transparent
    # background PNGs replacing the boxed Material icons.
    - assets/onboarding_upload.png
    - assets/onboarding_anywhere.png
    # ⚠️ NEW (Boss request — Visual Analyzer "Fix it with AI" card): real
    # transparent Gemini logo, used in visual_analyzer_screen.dart.
    - assets/gemini_icon.png

# Launcher icon config
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true